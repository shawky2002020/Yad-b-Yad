name: Visual Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/yadbyad-server.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/yadbyad-server.log
          exit 1

      - name: Capture and audit pages
        run: |
          cat > /tmp/visual-check.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';

          const pages = [
            'index.html',
            'project.html',
            'category.html',
            'activities.html',
            'cart.html',
            'checkout.html',
            'gift.html',
            'thanks.html',
            'profile.html',
            'login.html',
            'Beneficiary-registration.html',
            'Volunteer-registration.html',
            'about-us.html',
            'hawkama.html'
          ];

          const profiles = [
            { name: 'desktop', width: 1728, height: 1080 },
            { name: 'mobile', width: 402, height: 874 }
          ];

          const out = 'visual-output';
          fs.mkdirSync(out, { recursive: true });
          const browser = await chromium.launch({ headless: true });
          const results = [];
          let hasFailure = false;

          for (const profile of profiles) {
            fs.mkdirSync(path.join(out, profile.name), { recursive: true });
            const context = await browser.newContext({ viewport: { width: profile.width, height: profile.height } });

            for (const file of pages) {
              const page = await context.newPage();
              const consoleErrors = [];
              const pageErrors = [];
              const failedRequests = [];

              page.on('console', msg => {
                if (msg.type() === 'error') consoleErrors.push(msg.text());
              });
              page.on('pageerror', error => pageErrors.push(String(error)));
              page.on('requestfailed', req => failedRequests.push(`${req.method()} ${req.url()} :: ${req.failure()?.errorText || 'failed'}`));

              const response = await page.goto(`http://127.0.0.1:4173/${file}`, { waitUntil: 'networkidle', timeout: 30000 });
              await page.waitForTimeout(700);

              const metrics = await page.evaluate(() => ({
                title: document.title,
                bodyWidth: document.body.scrollWidth,
                viewportWidth: document.documentElement.clientWidth,
                bodyHeight: document.body.scrollHeight,
                viewportHeight: document.documentElement.clientHeight,
                horizontalOverflow: Math.max(document.body.scrollWidth, document.documentElement.scrollWidth) - document.documentElement.clientWidth,
                visibleImages: [...document.images].filter(img => {
                  const r = img.getBoundingClientRect();
                  return r.width > 0 && r.height > 0;
                }).length,
                brokenImages: [...document.images].filter(img => img.complete && img.naturalWidth === 0).map(img => img.getAttribute('src')),
                figmaPage: document.body.dataset.figmaPage || null
              }));

              const screenshot = path.join(out, profile.name, file.replace(/\.html$/i, '') + '.png');
              await page.screenshot({ path: screenshot, fullPage: true, animations: 'disabled' });

              const filteredRequestFailures = failedRequests.filter(x => !x.includes('fonts.googleapis.com') && !x.includes('fonts.gstatic.com'));
              const seriousConsoleErrors = consoleErrors.filter(x => !x.includes('Failed to load resource') || !x.includes('fonts'));
              const ok = response?.ok() && metrics.horizontalOverflow <= 2 && metrics.brokenImages.length === 0 && pageErrors.length === 0 && filteredRequestFailures.length === 0;
              if (!ok) hasFailure = true;

              results.push({
                profile: profile.name,
                file,
                httpStatus: response?.status() || null,
                ok,
                metrics,
                consoleErrors: seriousConsoleErrors,
                pageErrors,
                failedRequests: filteredRequestFailures,
                screenshot
              });
              await page.close();
            }
            await context.close();
          }

          await browser.close();
          fs.writeFileSync(path.join(out, 'report.json'), JSON.stringify(results, null, 2));

          const lines = ['# Yad-b-Yad Visual Check', '', '| Viewport | Page | HTTP | Overflow | Broken images | JS errors | Result |', '|---|---|---:|---:|---:|---:|---|'];
          for (const r of results) {
            lines.push(`| ${r.profile} | ${r.file} | ${r.httpStatus ?? '-'} | ${r.metrics.horizontalOverflow}px | ${r.metrics.brokenImages.length} | ${r.pageErrors.length} | ${r.ok ? 'PASS' : 'FAIL'} |`);
          }
          lines.push('', `Overall structural visual result: **${hasFailure ? 'FAIL' : 'PASS'}**`);
          fs.writeFileSync(path.join(out, 'summary.md'), lines.join('\n'));

          if (hasFailure) process.exitCode = 1;
          EOF
          node /tmp/visual-check.mjs

      - name: Upload visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-check
          path: visual-output
          if-no-files-found: error
          retention-days: 7
